# gitleaks config for the pre-commit hook and the CI `secrets-scan` job.
# Default rules plus the known false positives. Keep every entry as narrow as
# it can be. An allowlist with no `targetRules` skips its paths outright, even
# under `condition = "AND"`, so only the fixture-only entry goes without one.

[extend]
useDefault = true

[[allowlists]]
description = "Fixture-only files: benchmark inputs and the test TLS pair"
paths = [
  '''(^|/)bench/cases/''',
  '''(^|/)apps/core/tests/helpers/fixtures/[^/]+\.pem$''',
]

[[allowlists]]
description = "Throwaway RSA key the GitHub Actions OIDC test signs with"
targetRules = ["private-key"]
paths = ['''(^|/)apps/core/tests/github-actions\.test\.ts$''']

[[allowlists]]
description = "WorkOS placeholder the dashboard e2e config falls back to"
targetRules = ["stripe-access-token"]
condition = "AND"
paths = ['''(^|/)apps/dashboard/playwright\.config\.ts$''']
regexes = ['''sk_test_placeholder''']

[[allowlists]]
description = "Conversation and reservation keys are identifiers, not credentials"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = [
  '''(^|/)tests/''',
  '''\.test\.ts$''',
  '''(^|/)apps/docs/docs/architecture/queue-and-steer\.md$''',
]
regexes = ['''(?i)(conversation_?key|reservationKey)\b''']

[[allowlists]]
description = "Truncated example value in the OpenAPI spec"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)apps/docs/docs/api-reference/openapi\.yaml$''']
regexes = ['''fp_acct_xyz789''']

[[allowlists]]
description = "GitHub token committed once in 7664f775, token revoked, history not rewritten."
targetRules = ["github-fine-grained-pat", "curl-auth-header"]
condition = "AND"
commits = ["7664f775376e56f04bf3931598fcc7beb1b81b0b"]
paths = ['''settings/components/PluginsPanel\.tsx$''']
