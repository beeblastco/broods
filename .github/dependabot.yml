# Dependabot version updates.
#
# Known limitation (npm ecosystem): Dependabot does not regenerate `bun.lock`
# in a workspaces repo — https://github.com/dependabot/dependabot-core/issues/14223.
# Runner jobs install with `--no-save`, so an npm PR now arrives GREEN while
# `bun.lock` still pins the old version — CI proves nothing about the bump.
# Check the branch out, run `bun install`, and push the lockfile before
# believing it. Treat those PRs as "a release exists", and use
# `bun run deps:check` for the authoritative picture.
#
# Everything is grouped. The AI SDK packages pin `ai` at an exact version inside
# their own manifests, so one PR per package would each install a second copy of
# `ai` and break type identity; the `ai-sdk` group keeps them in one commit.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    ignore:
      # Pinned deliberately in root `overrides`; a bump here fights that.
      - dependency-name: "@types/node"
      - dependency-name: tar
      - dependency-name: webpack
      # eslint-config-next still ships eslint-plugin-react 7.x and
      # typescript-eslint 8.x, neither of which runs on eslint 10 — the plugin
      # calls the `context.getFilename()` that eslint 10 removed. Drop this once
      # eslint-config-next peers eslint 10.
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      # typescript-eslint currently supports TypeScript <6.1.0; the dashboard
      # lint job cannot load TypeScript 7 until that upstream peer range moves.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      ai-sdk:
        patterns:
          - ai
          - "@ai-sdk/*"
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
          - sst
      types:
        patterns:
          - "@types/*"
      remaining:
        patterns:
          - "*"
        exclude-patterns:
          - ai
          - "@ai-sdk/*"
          - "@aws-sdk/*"
          - "@types/*"
          - sst
