# Dependabot version updates.
#
# Known limitation (npm ecosystem): Dependabot does not regenerate `bun.lock`
# in a workspaces repo — https://github.com/dependabot/dependabot-core/issues/14223.
# Runner jobs install with `--no-save`, so an npm PR now arrives GREEN while
# `bun.lock` still pins the old version — CI proves nothing about the bump.
# Check the branch out, run `bun install`, and push the lockfile before
# believing it. Treat those PRs as "a release exists", and use
# `bun run deps:check` for the authoritative picture.
#
# Everything is grouped. The AI SDK packages pin `ai` at an exact version inside
# their own manifests, so one PR per package would each install a second copy of
# `ai` and break type identity; the `ai-sdk` group keeps them in one commit.
#
# For the same reason, any `@ai-sdk/*` package that itself pins `ai` must be an
# exact pin too (`harness*`, `otel`, `policy-opa`, `tui`). A caret there is
# invisible to Dependabot once the range is satisfied, so `ai` moves and the
# caret package stays behind on the `ai` it pinned. That is two copies again,
# and it surfaces as an unassignable `ChatTransport` in `packages/broods`, not
# as a version error. The provider packages take `@ai-sdk/provider` rather than
# `ai`, so carets are fine on those.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      ai-sdk:
        patterns:
          - ai
          - "@ai-sdk/*"
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
          - sst
      types:
        patterns:
          - "@types/*"
      remaining:
        patterns:
          - "*"
        exclude-patterns:
          - ai
          - "@ai-sdk/*"
          - "@aws-sdk/*"
          - "@types/*"
          - sst
