# Dependabot version updates.
#
# Use the Bun ecosystem so updates include `bun.lock` for frozen CI installs.
# `bun run deps:check` checks version alignment across the AI SDK family.
#
# Everything is grouped. The AI SDK packages pin `ai` at an exact version inside
# their own manifests, so one PR per package would each install a second copy of
# `ai` and break type identity; the `ai-sdk` group keeps them in one commit.
#
# For the same reason, any `@ai-sdk/*` package that itself pins `ai` must be an
# exact pin too (`harness*`, `otel`, `policy-opa`, `tui`). A caret there is
# invisible to Dependabot once the range is satisfied, so `ai` moves and the
# caret package stays behind on the `ai` it pinned. That is two copies again,
# and it surfaces as an unassignable `ChatTransport` in `packages/broods`, not
# as a version error. The provider packages take `@ai-sdk/provider` rather than
# `ai`, so carets are fine on those.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    ignore:
      # The dashboard reads next fire times with the cron-parser major that
      # @convex-dev/crons schedules with, so the two never disagree.
      - dependency-name: cron-parser
        update-types: ["version-update:semver-major"]
      # @posthog/ai holds sdk-trace-base on 2.x, which wants api below 1.10, so the
      # OpenTelemetry packages stay on that line together until it moves.
      - dependency-name: "@opentelemetry/*"
        versions: [">=0.300.0 <1.0.0", ">=1.10.0 <2.0.0", ">=3.0.0"]
      # @convex-dev/workos-authkit takes @workos-inc/node up to 10; a newer
      # major installs a second copy beside it.
      - dependency-name: "@workos-inc/node"
        update-types: ["version-update:semver-major"]
      # @convex-dev/stripe depends on stripe ^22 and shares our client types and
      # API version; lift once it ships a release on stripe 23.
      - dependency-name: stripe
        update-types: ["version-update:semver-major"]
    groups:
      ai-sdk:
        patterns:
          - ai
          - "@ai-sdk/*"
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
          - sst
      types:
        patterns:
          - "@types/*"
      remaining:
        patterns:
          - "*"
        exclude-patterns:
          - ai
          - "@ai-sdk/*"
          - "@aws-sdk/*"
          - "@types/*"
          - sst
