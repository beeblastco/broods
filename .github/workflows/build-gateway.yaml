name: Build Gateway Image

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "apps/gateway/**"
      # Modules the gateway imports by relative path, and what those import.
      # Nothing declares that dependency, so name them here or a change there
      # ships without a rebuild.
      - "apps/core/src/shared/env.ts"
      - "apps/core/src/shared/machine-socket.ts"
      - "apps/core/src/shared/nats.ts"
      - "apps/core/src/shared/paths.ts"
      - "apps/core/src/shared/request-id.ts"
      - "apps/core/src/shared/terminal-ticket.ts"
      - "packages/broods/src/observability-contracts.ts"
      - "packages/broods/src/run-input.ts"
      - "packages/broods/src/stream.ts"
      - "packages/broods/src/websocket-contracts.ts"
      - "packages/convex/model/apiError.ts"
      - "packages/convex/model/httpJson.ts"
      - "packages/convex/model/serviceBridge.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/build-gateway.yaml"
      - ".github/actions/bun-install/**"
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/beeblastco/broods-gateway

# Each job grants only the token permissions it needs.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        uses: ./.github/actions/bun-install
        with:
          args: --ignore-scripts --no-save

      - name: Type-check gateway
        run: bun run --filter @broods/gateway check

      - name: Test gateway
        run: bun run --filter @broods/gateway test

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: apps/gateway/Dockerfile
          push: true
          # The floating branch tag only for dev and main: a feature branch's
          # name has a slash, which no image tag may hold, so a manual dispatch
          # to test a branch on the dev stage ships by sha alone.
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ (github.ref_name == 'dev' || github.ref_name == 'main') && format('{0}:{1}', env.IMAGE_NAME, github.ref_name) || '' }}
          cache-from: type=gha,scope=broods-gateway
          cache-to: type=gha,mode=max,scope=broods-gateway

  rollout:
    needs: build
    if: ${{ github.ref_name == 'dev' || github.ref_name == 'main' }}
    # Core first. The gateway asks core to resolve every observability and
    # agent socket's credential and refuses an answer missing a field it
    # expects (a scope with no expiry is a 502), so it must not reach the
    # cluster ahead of the core it asks. build-core.yaml's run for this sha
    # ends with core's own rollout; a push that did not touch core waits on
    # the core the branch last rolled. The image itself depends on neither
    # Convex nor the AWS data plane, so it waits for nothing else.
    permissions:
      actions: read
    uses: ./.github/workflows/rollout.yaml
    with:
      workflow: ${{ github.ref_name == 'main' && 'deploy-gateway.yaml' || 'deploy-gateway-dev.yaml' }}
      tag: ${{ github.sha }}
      awaitWorkflows: build-core.yaml
    secrets:
      dispatchToken: ${{ secrets.INFRA_DISPATCH_TOKEN }}
