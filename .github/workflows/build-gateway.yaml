name: Build Gateway Image

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "apps/gateway/**"
      # Modules the gateway imports by relative path, and what those import.
      # Nothing declares that dependency, so name them here or a change there
      # ships without a rebuild.
      - "apps/core/src/shared/env.ts"
      - "apps/core/src/shared/machine-socket.ts"
      - "apps/core/src/shared/nats.ts"
      - "apps/core/src/shared/object.ts"
      - "apps/core/src/shared/request-id.ts"
      - "apps/core/src/shared/terminal-ticket.ts"
      - "packages/broods/src/observability-contracts.ts"
      - "packages/broods/src/run-input.ts"
      - "packages/broods/src/stream.ts"
      - "packages/broods/src/websocket-contracts.ts"
      - "packages/convex/model/apiError.ts"
      - "packages/convex/model/httpJson.ts"
      - "packages/convex/model/serviceBridge.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/build-gateway.yaml"
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/beeblastco/broods-gateway

# Each job grants only the token permissions it needs.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --ignore-scripts --no-save

      - name: Type-check gateway
        run: bun run --filter @broods/gateway check

      - name: Test gateway
        run: bun run --filter @broods/gateway test

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: apps/gateway/Dockerfile
          push: true
          # The floating branch tag only for dev and main: a feature branch's
          # name has a slash, which no image tag may hold, so a manual dispatch
          # to test a branch on the dev stage ships by sha alone.
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ (github.ref_name == 'dev' || github.ref_name == 'main') && format('{0}:{1}', env.IMAGE_NAME, github.ref_name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  rollout:
    needs: build
    if: ${{ github.ref_name == 'dev' || github.ref_name == 'main' }}
    # No prerequisite gate: this image depends on neither Convex nor the
    # AWS data plane. The grant is still required because rollout.yaml
    # declares it and a called workflow can never hold more than its caller.
    permissions:
      actions: read
    uses: ./.github/workflows/rollout.yaml
    with:
      workflow: ${{ github.ref_name == 'main' && 'deploy-gateway.yaml' || 'deploy-gateway-dev.yaml' }}
      tag: ${{ github.sha }}
    secrets:
      dispatchToken: ${{ secrets.INFRA_DISPATCH_TOKEN }}
