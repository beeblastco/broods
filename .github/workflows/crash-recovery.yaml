# Nightly `bun run local:crash` on dev (#1183): every late result must be told exactly once after
# core is killed mid-resume, or after a status read before its save. ~45 min, so not on PRs. A
# failure keeps one `crash-recovery` issue open and hands it to Claude Code, which opens a fix PR
# (never merges) or comments why not.

name: Crash Recovery

on:
  schedule:
    - cron: "37 1 * * *"
  workflow_dispatch:

concurrency:
  group: crash-recovery
  cancel-in-progress: false

permissions: {}

jobs:
  crash:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # Traded for a Claude GitHub App token: its PRs run CI, GITHUB_TOKEN's do not.
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/bun-install

      - name: Start the local stack with the in-process model
        run: bun run local:up -- --perf

      - name: Crash core between a result's handover and its save
        id: crash
        run: |
          set -o pipefail
          bun run local:crash -- --out crash.json 2>&1 | tee crash.log

      - name: Upload results and stack logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: crash-recovery-${{ github.run_id }}
          path: |
            crash.json
            crash.log
            ~/.broods-local/*/logs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Open, update or close the crash-recovery issue
        id: issue
        if: always() && github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PASSED: ${{ steps.crash.outcome == 'success' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create crash-recovery --color B60205 --force >/dev/null
          number=$(gh issue list --label crash-recovery --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          if [[ "$PASSED" == "true" ]]; then
            [[ -z "$number" ]] || gh issue close "$number" --comment "Passed on $GITHUB_SHA: $RUN_URL"
            exit 0
          fi
          body=$(printf 'Failed on %s: %s\n\n```\n%s\n```\n' "$GITHUB_SHA" "$RUN_URL" \
            "$(tail -n 40 crash.log 2>/dev/null || echo 'failed before the crash step')")
          if [[ -n "$number" ]]; then
            gh issue edit "$number" --body "$body"
          else
            number=$(gh issue create --label crash-recovery --body "$body" \
              --title "Crash recovery: a late result was lost or told twice" | grep -oE '[0-9]+$')
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Hand the failure to Claude Code
        if: failure() && steps.issue.outputs.number != ''
        uses: anthropics/claude-code-action@e4a6faad497d33dbc7144135c75e41f82f0bf6c0 # v1.0.255
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 200
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep"
          prompt: |
            The nightly crash-recovery test failed on dev at ${{ github.sha }}.
            Issue: #${{ steps.issue.outputs.number }}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Follow the root AGENTS.md. `bun run local:crash` (scripts/local-verify/crash-recovery.ts,
            hold in scripts/local-verify/fake-model.ts) kills core after the sweep hands late results
            to resumes, or after an `async_status` read (of a persisted turn, or of a subagent that
            saves no history), and before the write that stores them; each must then be told once
            and read `stored`. The perf stack is still up; crash.json, crash.log and
            ~/.broods-local/*/logs/ are on this runner.

            Find the root cause ("flake" is not one) and confirm it with `bun run local:crash`. If you
            can fix it, in the product or the harness, do it on branch
            `claude/crash-recovery-${{ github.run_id }}` from dev with focused tests, rerun the test
            until it passes, and open one PR against dev that links the issue. Never loosen the
            assertion. If the cause is unclear or the fix is a design change, comment your diagnosis
            on the issue instead. Never merge, approve or deploy. End anything you post with:

            ---
            _Generated by [Claude Code](https://claude.ai/code)_
