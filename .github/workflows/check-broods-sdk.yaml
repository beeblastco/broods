name: Check broods SDK Package

on:
  pull_request:
    paths:
      - "packages/broods/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/check-broods-sdk.yaml"
      - ".github/workflows/publish-npm.yaml"
  push:
    branches-ignore:
      - main
    paths:
      - "packages/broods/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/check-broods-sdk.yaml"
      - ".github/workflows/publish-npm.yaml"
  workflow_dispatch:

jobs:
  # Not `validate`: that is the name of the required CI check on `dev`, and two
  # check runs sharing one name make the branch rule ambiguous about which of
  # them it is waiting on.
  sdk-package:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --ignore-scripts --no-save

      - name: Typecheck SDK
        run: bun run --filter broods check

      - name: Test SDK
        run: bun run --filter broods test

      - name: Pack check
        working-directory: packages/broods
        run: bun run pack:check
