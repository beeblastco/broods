name: Publish npm Package

on:
  push:
    branches:
      - main
    paths:
      - "packages/broods/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/publish-npm.yaml"
  workflow_dispatch:

concurrency:
  group: publish-npm-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    # main-only; dispatching already requires write access, so manual re-runs
    # (e.g. after a transient publish failure) are allowed too.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      # contents: write tags the published commit and cuts the GitHub release.
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: Setup Node for npm publish
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # NOTE: no `npm install -g npm@latest` here — overwriting the bundled npm
      # in the hosted toolcache left it half-installed once ("Cannot find
      # module 'sigstore'" during the provenance publish).
      - name: Install dependencies
        run: bun install --ignore-scripts --no-save

      - name: Read package version
        id: package
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_VERSION="$(node -p "require('./packages/broods/package.json').version")"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing candidate: broods@$PACKAGE_VERSION"

      - name: Typecheck SDK
        run: bun run --filter broods check

      - name: Test SDK
        run: bun run --filter broods test

      - name: Pack check
        working-directory: packages/broods
        run: bun run pack:check

      - name: Check npm version availability
        id: npm-version
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_NAME="$(node -p "require('./packages/broods/package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./packages/broods/package.json').version")"
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published; skipping npm publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.npm-version.outputs.exists == 'false'
        working-directory: packages/broods
        run: npm publish

      # Tag prefixed, not a bare `v0.6.0`: this monorepo publishes one package
      # today but the tag namespace has to survive a second one.
      - name: Tag and release
        if: steps.npm-version.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail

          TAG="broods-v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG already released; nothing to do."
            exit 0
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "broods $VERSION" \
            --generate-notes
          echo "Published and released **broods $VERSION** ([npm](https://www.npmjs.com/package/broods/v/$VERSION))." >> "$GITHUB_STEP_SUMMARY"
