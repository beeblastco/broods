name: Lean verification

# Always reports the uniquely named required check. The models, their pinned
# statements and mirrored code, and the TypeScript contract tests run together.
on:
  pull_request:
  push:
    branches: [dev]
  # Nightly: the oracles on a random seed and 25x the cases, since a fixed seed finds
  # nothing new after the first day. The log prints the seed to replay a failure.
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: lean-verification-${{ github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lean-verification:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: verification
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install dependencies
        uses: ./.github/actions/bun-install

      - name: Generate the core prompt
        working-directory: apps/core
        run: bun run scripts/compaction-prompt.ts

      - name: Cache the Lean toolchain and build
        # elan with its Lean, and lake's build outputs. A source change saves
        # fresh outputs over the last ones; a manifest change keeps the
        # toolchain and rebuilds; a toolchain change downloads a fresh one.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.elan
            verification/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('verification/lean-toolchain') }}-${{ hashFiles('verification/lake-manifest.json') }}-${{ hashFiles('verification/**/*.lean', 'verification/lakefile.toml') }}
          restore-keys: |
            lean-${{ runner.os }}-${{ hashFiles('verification/lean-toolchain') }}-${{ hashFiles('verification/lake-manifest.json') }}-
            lean-${{ runner.os }}-${{ hashFiles('verification/lean-toolchain') }}-

      # elan reads verification/lean-toolchain and installs that exact Lean.
      # The installer is pinned to the v4.2.4 release commit. A cached elan
      # is kept; the step still puts it on PATH.
      - name: Install elan
        run: |
          if [[ ! -x "$HOME/.elan/bin/elan" ]]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/227caca133724d5516bee25c2aeb3e609478f2d8/elan-init.sh \
              | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Broods.lean fails the build when a proof rests on `sorry`,
      # `native_decide` or an axiom past the three standard ones.
      - name: Build and check every proof
        run: lake build && lake build gateway-oracle sync-oracle cron-oracle

      - name: Check theorem statements against statements.txt
        run: lake env lean Statements.lean

      - name: Check mirrored TypeScript against mirrors.json
        working-directory: .
        run: bun verification/drift.ts

      - name: Pick a random oracle seed
        if: github.event_name == 'schedule'
        run: |
          seed=$(( (RANDOM << 15 | RANDOM) + 1 ))
          echo "ORACLE_SEED=$seed" >> "$GITHUB_ENV"
          echo "ORACLE_RUNS=50000" >> "$GITHUB_ENV"
          echo "oracle seed $seed: replay with ORACLE_SEED=$seed ORACLE_RUNS=50000 bun run verification:test"

      # Includes the differential tests that run the Lean gateway, sync and cron models as oracles.
      - name: Check the TypeScript contracts
        working-directory: .
        run: bun run verification:test
