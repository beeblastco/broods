# Drift cleanup.
# Runs `sst refresh` + `sst diff` for every active stage nightly. On `dev`, drift
# is reconciled with `sst deploy` (deleting resources whose code was removed).
# On production-* stages the run is report-only: drift fails the job so the
# failure notification reaches a human, who reconciles through deploy.yaml.
# This is the safety net for stages that did not get reconciled at the time of
# a code change (e.g. a failed deploy on `dev`). It is the second line of
# defence against billable orphans (NAT Gateways, EIPs, unused log groups,
# deprecated Lambda functions).
#
# Refs: the `production` environment only deploys from `main`, and the schedule
# runs on the default branch (`dev`). So the scheduled run checks the non-
# production stages itself and dispatches this workflow on `main` once per
# production stage. A production dispatch from any other ref fails fast.
#
# Locking: each stage job takes the same `sst-<stage>` concurrency group as the
# deploy job in deploy.yaml, so drift never touches a stage mid-deploy and never
# needs `sst unlock`. A lock left behind by a crashed run fails the deploy here;
# clear it by hand after checking nothing is running.
#
# Logs: the refresh/diff output names ARNs, so the account id is masked and the
# plan stays in the job log only (no artifact, no step summary dump). The repo
# is public.
#
# Trigger:
#   - schedule: 0 3 * * * (03:00 UTC daily; low-traffic window)
#   - workflow_dispatch: one stage; production-* only with `--ref main`

name: Drift Cleanup

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      stage:
        description: SST stage to check. production-* runs only from main.
        required: true
        type: choice
        default: dev
        options:
          - dev
          - production-eu-west-1

permissions:
  contents: read

jobs:
  plan:
    name: Pick stages
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      production: ${{ steps.pick.outputs.production }}
    steps:
      - name: Pick stages
        id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_STAGE: ${{ inputs.stage }}
        shell: bash
        run: |
          set -euo pipefail

          # stage|region|ref. `ref` is the branch that feeds the stage, as in
          # deploy.yaml. Stand up a new stage = add it here (and to the
          # dispatch options) or drift eats it.
          STAGES='dev|eu-west-1|dev
          production-eu-west-1|eu-west-1|main'

          selected=""
          production=""
          while IFS='|' read -r stage region ref; do
            if [[ "$EVENT_NAME" == "schedule" ]]; then
              if [[ "$stage" == production* ]]; then
                production+="$stage "
                continue
              fi
            elif [[ "$stage" != "$INPUT_STAGE" ]]; then
              continue
            elif [[ "$stage" == production* && "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::Stage $stage runs only from main (this run is on $GITHUB_REF). Dispatch with --ref main."
              exit 1
            fi
            selected+="${stage}|${region}|${ref}"$'\n'
          done <<< "$STAGES"

          matrix="$(printf '%s' "$selected" | jq -Rnc '[inputs | select(length > 0) | split("|") | {stage: .[0], region: .[1], ref: .[2]}]')"
          {
            echo "matrix=$matrix"
            echo "production=$production"
          } >> "$GITHUB_OUTPUT"

  # Own job so a failed dispatch neither blocks nor hides the dev pass.
  dispatch-production:
    name: Dispatch production stages on main
    needs: plan
    if: needs.plan.outputs.production != ''
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          STAGES: ${{ needs.plan.outputs.production }}
        shell: bash
        run: |
          set -euo pipefail
          for stage in $STAGES; do
            echo "Dispatching $stage on main"
            gh workflow run drift-cleanup.yaml --repo "$GITHUB_REPOSITORY" --ref main -f stage="$stage"
          done

  reconcile:
    name: Reconcile ${{ matrix.stage }}
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    strategy:
      # Each stage must finish (or fail) independently. One stage failing
      # must not block another's cleanup pass.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    # Same key as deploy.yaml's deploy job. Every production-* stage shares one.
    concurrency:
      group: sst-${{ startsWith(matrix.stage, 'production') && 'production' || matrix.stage }}
      cancel-in-progress: false

    # Mirror deploy.yaml's environment mapping so the diff sees the same
    # per-environment Convex credentials a normal deploy does.
    environment: ${{ startsWith(matrix.stage, 'production') && 'production' || 'development' }}

    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME }}
      PROJECT_OWNER_EMAIL: ${{ vars.PROJECT_OWNER_EMAIL }}
      # Mirrors deploy.yaml env block for SST/Pulumi to compose the same
      # identity, runtime, and Convex credentials it sees on a normal deploy.
      CI: "true"
      CONVEX_URL: ${{ secrets.CONVEX_URL }}
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      # Same as deploy.yaml: without it the plan omits the sandbox log forwarder
      # and drift would delete the deployed one.
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
      # Do NOT pass SANDBOX_IMAGE_READY_* for drift cleanup. Drift should
      # only reconcile state, not bootstrap sandbox images. The deploy
      # workflow owns that mirror step.

    steps:
      # vars are not masked like secrets; every ARN in the plan carries this id.
      - name: Mask AWS account id
        run: echo "::add-mask::${AWS_ACCOUNT_ID}"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ matrix.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          aws-region: ${{ matrix.region }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Install dependencies (skip sst postinstall)
        # --ignore-scripts keeps `sst install` from running here; sst is
        # invoked via bunx below.
        run: bun install --ignore-scripts --no-save

      - name: Detect drift (refresh + diff)
        id: detect
        working-directory: apps/core
        env:
          TARGET_STAGE: ${{ matrix.stage }}
          TARGET_REGION: ${{ matrix.region }}
        shell: bash
        run: |
          set -uo pipefail

          LOG_DIR="/tmp/drift-${TARGET_STAGE}"
          mkdir -p "$LOG_DIR"

          echo "::group::sst refresh: pull real cloud state into Pulumi state"
          AWS_REGION="$TARGET_REGION" AWS_DEFAULT_REGION="$TARGET_REGION" \
            bunx sst refresh --stage "$TARGET_STAGE" \
            2>&1 | tee "$LOG_DIR/refresh.log"
          echo "::endgroup::"

          echo "::group::sst diff: compute desired-vs-actual plan"
          # sst diff returns non-zero on errors, zero with content for diffs
          # and zero without content when the stack already matches.
          AWS_REGION="$TARGET_REGION" AWS_DEFAULT_REGION="$TARGET_REGION" \
            bunx sst diff --stage "$TARGET_STAGE" \
            2>&1 | tee "$LOG_DIR/diff.log"
          DIFF_RC=$?
          echo "::endgroup::"

          if [ "$DIFF_RC" -ne 0 ]; then
            echo "::error::sst diff exited $DIFF_RC for $TARGET_STAGE; not applying anything"
            exit "$DIFF_RC"
          fi

          # Drift signal: any Pulumi-style diff line (starts with +, -, ~) at
          # column 0 (resource-level) or after 6 spaces (attribute-level).
          if grep -qE '^([\+\-\~] |^      [\+\-\~] )' "$LOG_DIR/diff.log"; then
            echo "drift_detected=true" >> "$GITHUB_OUTPUT"
            echo "## Drift detected for stage \`$TARGET_STAGE\` in \`$TARGET_REGION\`. The plan is in the \"Detect drift\" step log." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "drift_detected=false" >> "$GITHUB_OUTPUT"
            echo "## No drift for stage \`$TARGET_STAGE\` in \`$TARGET_REGION\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report production drift
        if: steps.detect.outputs.drift_detected == 'true' && startsWith(matrix.stage, 'production')
        env:
          TARGET_STAGE: ${{ matrix.stage }}
        run: |
          echo "::error::Drift on $TARGET_STAGE. Report-only: review the diff above and reconcile with the Deploy workflow from main."
          exit 1

      - name: Reconcile (sst deploy)
        if: steps.detect.outputs.drift_detected == 'true' && !startsWith(matrix.stage, 'production')
        working-directory: apps/core
        env:
          TARGET_STAGE: ${{ matrix.stage }}
          TARGET_REGION: ${{ matrix.region }}
        shell: bash
        run: |
          set -uo pipefail

          echo "::group::sst deploy: apply reconciliation for $TARGET_STAGE"
          AWS_REGION="$TARGET_REGION" AWS_DEFAULT_REGION="$TARGET_REGION" \
            SST_STAGE="$TARGET_STAGE" \
            bunx sst deploy --stage "$TARGET_STAGE" --print-logs
          DEPLOY_RC=$?
          echo "::endgroup::"

          if [ "$DEPLOY_RC" -ne 0 ]; then
            echo "::error::sst deploy failed for $TARGET_STAGE in $TARGET_REGION (rc=$DEPLOY_RC)"
            exit "$DEPLOY_RC"
          fi

          echo "## sst deploy reconciled \`$TARGET_STAGE\` in \`$TARGET_REGION\`" >> "$GITHUB_STEP_SUMMARY"
