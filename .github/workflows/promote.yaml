# One-click promotion: waits for dev's required checks, fast-forwards main to
# dev, then dispatches the main deploy workflows. Pushes made with GITHUB_TOKEN
# do not fire `on: push` workflows (recursion guard), so the production
# workflows are dispatched explicitly: Convex first, then the rest in parallel.

name: Promote dev to main

on:
  workflow_dispatch:

concurrency:
  group: promote-main
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve promotion
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin dev
          dev_sha=$(git rev-parse FETCH_HEAD)
          if git merge-base --is-ancestor "$dev_sha" HEAD; then
            echo "main already contains dev; nothing to promote."
            echo "PROMOTED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          if ! git merge-base --is-ancestor HEAD "$dev_sha"; then
            echo "main has commits that are not on dev; refusing a non-fast-forward promote." >&2
            echo "Merge main back into dev first, then re-run this workflow." >&2
            exit 1
          fi

          echo "PROMOTED=true" >> "$GITHUB_ENV"
          echo "DEV_SHA=$dev_sha" >> "$GITHUB_ENV"

      # main's ruleset rejects a push whose commit still has required checks
      # running, so hold until dev's head is green. The contexts come from the
      # ruleset itself, so editing the rules does not strand this workflow.
      - name: Wait for dev's required checks
        if: env.PROMOTED == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          required=$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" \
            --jq '[.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context] | unique | .[]')

          if [[ -z "$required" ]]; then
            echo "main requires no status checks; promoting without waiting."
            exit 0
          fi

          for _ in $(seq 1 120); do
            checks=$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEV_SHA/check-runs?per_page=100")

            pending=""
            while IFS= read -r context; do
              verdict=$(jq -r --arg context "$context" '
                [.check_runs[] | select(.name == $context)] | sort_by(.started_at) | last
                | if . == null then "missing"
                  elif .status != "completed" then "running"
                  elif (.conclusion as $conclusion | ["success", "skipped", "neutral"] | index($conclusion)) then "passed"
                  else "failed"
                  end' <<< "$checks")

              case "$verdict" in
                passed) ;;
                failed)
                  echo "Required check \"$context\" failed on dev ($DEV_SHA); fix dev before promoting." >&2
                  exit 1
                  ;;
                *) pending="$pending $context ($verdict)" ;;
              esac
            done <<< "$required"

            if [[ -z "$pending" ]]; then
              echo "dev ($DEV_SHA) is green on every required check."
              exit 0
            fi

            echo "Waiting on:$pending"
            sleep 15
          done

          echo "Timed out waiting for dev's required checks; re-run once they finish." >&2
          exit 1

      - name: Fast-forward main to dev
        if: env.PROMOTED == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git merge --ff-only "$DEV_SHA"
          git push origin main
          echo "PROMOTED_SHA=$DEV_SHA" >> "$GITHUB_ENV"

      - name: Trigger main deploys
        if: env.PROMOTED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          dispatch_and_wait() {
            local workflow="$1"
            local dispatched_at run_id
            dispatched_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

            gh workflow run "$workflow" --ref main --repo "$GITHUB_REPOSITORY"

            for _ in $(seq 1 60); do
              run_id=$(gh api \
                "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=main&event=workflow_dispatch&per_page=20" \
                --jq "[.workflow_runs[] | select(.head_sha == \"$PROMOTED_SHA\" and .created_at >= \"$dispatched_at\")] | .[0].id // empty")
              if [[ -n "$run_id" ]]; then
                break
              fi
              sleep 2
            done

            if [[ -z "${run_id:-}" ]]; then
              echo "Timed out waiting for $workflow to start for $PROMOTED_SHA" >&2
              return 1
            fi

            gh run watch "$run_id" --exit-status --repo "$GITHUB_REPOSITORY"
          }

          # Convex schema/functions first, then the AWS data plane that calls
          # them: that deploy must not start until the new schema exists. The
          # remaining workflows are independent, so they are dispatched in
          # parallel and the promote finishes when the slowest one does. `on:
          # push` does not fire for the promote's bot push, so each of these
          # must be dispatched explicitly.
          dispatch_and_wait deploy-convex.yaml

          workflows=(
            deploy.yaml
            build-core.yaml
            build-gateway.yaml
            build-dashboard.yaml
            deploy-docs.yaml
            publish-npm.yaml
          )

          pids=()
          for workflow in "${workflows[@]}"; do
            dispatch_and_wait "$workflow" &
            pids+=("$!")
          done

          failed=0
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then
              echo "A production workflow failed; promote left incomplete." >&2
              failed=1
            fi
          done

          exit "$failed"
