# Deploys the shared Convex backend (schema + functions) on its own, so a
# backend change reaches Convex without waiting on the dashboard image build
# or being blocked by it. The dashboard image still rebuilds separately to pick
# up generated type changes; it no longer runs `convex deploy` itself.

name: Deploy Convex

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "packages/convex/**"
      - ".github/workflows/deploy-convex.yaml"
      - ".github/actions/bun-install/**"
  workflow_dispatch:

concurrency:
  group: deploy-convex-${{ github.ref_name }}
  cancel-in-progress: false

# Each job grants only the token permissions it needs.
permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    # main deploys to the production Convex deployment, everything else to dev.
    # The environment provides the matching CONVEX_DEPLOY_KEY secret.
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install dependencies
        uses: ./.github/actions/bun-install
        with:
          args: --ignore-scripts --no-save

      - name: Deploy Convex
        working-directory: packages/convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CONVEX_SELF_HOSTED_URL: ${{ secrets.CONVEX_SELF_HOSTED_URL }}
          CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ secrets.CONVEX_SELF_HOSTED_ADMIN_KEY }}
          # Through env, not ${{ }} in the script: a branch name can carry shell.
          REF_NAME: ${{ github.ref_name }}
          # The sign-in the target backend trusts. The environment owns the
          # backend, so it owns this too; unset means WorkOS, the managed login.
          AUTH_PROVIDER: ${{ vars.BROODS_AUTH_PROVIDER || 'workos' }}
          # Keys the PostHog user id, same value as core's; unset leaves the
          # backend's value alone.
          ANALYTICS_ID_SECRET: ${{ secrets.ANALYTICS_ID_SECRET }}
          # The dashboard's sign-in callback, whose origin is the only one
          # Stripe checkout and the portal may return to; unset leaves the
          # backend's value alone.
          DASHBOARD_ORIGIN: ${{ vars.NEXT_PUBLIC_WORKOS_REDIRECT_URI }}
          # The Pro and extra seat prices Upgrade and Add seat bill; unset
          # leaves the backend's value alone.
          STRIPE_PRO_PRICE_ID: ${{ vars.STRIPE_PRO_PRICE_ID }}
          STRIPE_SEAT_PRICE_ID: ${{ vars.STRIPE_SEAT_PRICE_ID }}
        run: |
          # Self-hosted backends authenticate with an admin key against an
          # explicit URL; there is no deploy key. The environment provides one
          # scheme or the other.
          if [[ -n "$CONVEX_SELF_HOSTED_URL" ]]; then
            if [[ -z "$CONVEX_SELF_HOSTED_ADMIN_KEY" ]]; then
              echo "CONVEX_SELF_HOSTED_URL is set without CONVEX_SELF_HOSTED_ADMIN_KEY" >&2
              exit 1
            fi
            # Self-hosted URLs carry no prod: marker, so pin main to the
            # production backend by URL instead.
            if [[ "$REF_NAME" == "main" && "$CONVEX_SELF_HOSTED_URL" != "https://convex-api.broods.app" ]]; then
              echo "main requires CONVEX_SELF_HOSTED_URL=https://convex-api.broods.app in the 'production' environment" >&2
              exit 1
            fi
            unset CONVEX_DEPLOY_KEY
          elif [[ -z "$CONVEX_DEPLOY_KEY" ]]; then
            echo "Missing environment secret: CONVEX_DEPLOY_KEY (or CONVEX_SELF_HOSTED_URL)" >&2
            exit 1
          # Convex deploy keys encode their target deployment. Refuse to ship a
          # main deploy that would push functions to a non-production deployment.
          elif [[ "$REF_NAME" == "main" && "$CONVEX_DEPLOY_KEY" != prod:* ]]; then
            echo "main requires a production Convex deploy key (prod:...) in the 'production' environment secret CONVEX_DEPLOY_KEY" >&2
            exit 1
          fi
          # The deploy fails on an auth config that reads an unset variable, so
          # the provider is pinned before every deploy.
          bunx convex env set BROODS_AUTH_PROVIDER "$AUTH_PROVIDER"
          if [[ -n "$ANALYTICS_ID_SECRET" ]]; then
            bunx convex env set ANALYTICS_ID_SECRET "$ANALYTICS_ID_SECRET"
          fi
          if [[ -n "$DASHBOARD_ORIGIN" ]]; then
            bunx convex env set DASHBOARD_ORIGIN "$(bun -p 'new URL(process.env.DASHBOARD_ORIGIN).origin')"
          fi
          for name in STRIPE_PRO_PRICE_ID STRIPE_SEAT_PRICE_ID; do
            if [[ -n "${!name}" ]]; then
              bunx convex env set "$name" "${!name}"
            fi
          done
          bun run deploy
