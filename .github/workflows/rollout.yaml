name: Roll a pod in infra

# Building an image deploys nothing: the pods live in a k3s cluster the infra
# repo owns. Without a rollout a green build means only that a tag moved, which
# is how core-dev once served a months-old image behind a passing pipeline, and
# how dashboard-dev did the same for weeks.

on:
  workflow_call:
    inputs:
      workflow:
        description: "Workflow file in the infra repo to dispatch"
        required: true
        type: string
      tag:
        description: "Image tag to roll (a commit sha)"
        required: true
        type: string
      awaitWorkflows:
        description: >-
          Space-separated workflow files in this repo that must have succeeded
          for this sha before the image is allowed onto the cluster. Each is
          skipped when it did not run for this commit.
        required: false
        default: ""
        type: string
    secrets:
      dispatchToken:
        description: "Fine-grained PAT for the infra repo, Actions: read and write"
        required: true

jobs:
  rollout:
    runs-on: ubuntu-24.04
    # 20 minutes for the prerequisite gate and 20 for the roll. A rollout that
    # has not finished in 20 is stuck, not slow: infra caps the Helm wait at 5m
    # and the rollout status at another 5m. Each step carries its own half, so
    # a hung prerequisite cannot eat the budget the roll needs.
    timeout-minutes: 40
    # Reading this repo's own run list is how the prerequisite gate works, and
    # the repository default is read-only. A called workflow can never hold more
    # than its caller, so every caller grants this too.
    permissions:
      actions: read
    steps:
      - name: Wait for the prerequisites of this sha
        if: inputs.awaitWorkflows != ''
        timeout-minutes: 20
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AWAIT_WORKFLOWS: ${{ inputs.awaitWorkflows }}
          SHA: ${{ inputs.tag }}
        # A push fans out to every workflow whose paths it touched, and nothing
        # orders them. Left alone, a core image reaches the cluster while the
        # Convex deploy carrying the schema it expects is still running.
        run: |
          set -euo pipefail

          # 20 minutes per prerequisite, matching the step timeout that bounds
          # them all. One that has not settled by then is stuck, and rolling
          # anyway is the failure this gate exists to stop.
          DEADLINE=120

          for AWAIT in $AWAIT_WORKFLOWS; do
            RUNS="repos/$GITHUB_REPOSITORY/actions/workflows/$AWAIT/runs?head_sha=$SHA&per_page=1"

            # GitHub creates a run for every workflow a push triggers before any
            # job starts, and this job only runs after the image build. So by
            # now the answer is settled: no run means this commit did not touch
            # what $AWAIT watches, and there is nothing to wait for.
            if [[ "$(gh api "$RUNS" --jq '.workflow_runs[0].status // "absent"')" == "absent" ]]; then
              echo "$AWAIT did not run for $SHA; nothing to wait for."
              continue
            fi

            echo "Waiting for $AWAIT to settle for $SHA"
            for _ in $(seq 1 "$DEADLINE"); do
              STATUS=$(gh api "$RUNS" --jq '.workflow_runs[0].status // "absent"')
              if [[ "$STATUS" == "completed" ]]; then
                break
              fi
              sleep 10
            done

            # Still in_progress at the deadline leaves conclusion null, which
            # lands here as "none" and fails — a stuck prerequisite is not a
            # reason to roll.
            CONCLUSION=$(gh api "$RUNS" --jq '.workflow_runs[0].conclusion // "none"')
            if [[ "$CONCLUSION" != "success" ]]; then
              echo "$AWAIT for $SHA concluded '$CONCLUSION'." >&2
              echo "Refusing to roll an image ahead of the backend it expects." >&2
              exit 1
            fi

            echo "$AWAIT succeeded for $SHA."
          done

      - name: Roll the pod and wait for the rollout
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.dispatchToken }}
          INFRA_REPO: beeblastco/infra
          TAG: ${{ inputs.tag }}
          WORKFLOW: ${{ inputs.workflow }}
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "Missing secret: INFRA_DISPATCH_TOKEN" >&2
            echo "Needs a fine-grained PAT scoped to $INFRA_REPO with Actions: read and write." >&2
            exit 1
          fi

          # Run ids only ever increase, so the newest one before dispatching is a
          # floor that no earlier run can clear. Without it a rerun of this job
          # matches the previous rollout of the same tag and reports its result.
          RUNS_URL="repos/$INFRA_REPO/actions/workflows/$WORKFLOW/runs?event=workflow_dispatch"
          FLOOR_ID=$(gh api "$RUNS_URL&per_page=1" --jq '.workflow_runs[0].id // 0')

          gh workflow run "$WORKFLOW" --repo "$INFRA_REPO" --ref main -f tag="$TAG"

          # An infra run reports infra's own head_sha and the API hides dispatch
          # inputs, so the tag is matched out of display_title instead — infra's
          # run-name puts it there precisely so a caller can find its own run.
          for _ in $(seq 1 60); do
            RUN_ID=$(gh api "$RUNS_URL&per_page=20" \
              --jq "[.workflow_runs[]
                     | select(.id > $FLOOR_ID)
                     | select(.display_title | endswith(\" $TAG\"))] | .[0].id // empty")
            if [[ -n "$RUN_ID" ]]; then
              break
            fi
            sleep 5
          done

          if [[ -z "${RUN_ID:-}" ]]; then
            echo "No $WORKFLOW run in $INFRA_REPO newer than $FLOOR_ID reported tag $TAG" >&2
            exit 1
          fi

          echo "Watching $INFRA_REPO run $RUN_ID (floor $FLOOR_ID, tag $TAG)"

          gh run watch "$RUN_ID" --repo "$INFRA_REPO" --exit-status
