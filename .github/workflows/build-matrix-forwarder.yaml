name: Build Matrix Forwarder Image

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "apps/matrix-forwarder/**"
      # Imported by relative path: the two core modules and the Discord
      # forwarder helpers. Nothing declares that dependency, so name them here
      # or a rename ships broken.
      - "apps/core/src/shared/env.ts"
      - "apps/core/src/shared/matrix-wire.ts"
      - "apps/discord-forwarder/src/**"
      # Copied into the image, and it owns the config-plane query the forwarder
      # reads, so a change there ships broken without a rebuild.
      - "packages/convex/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/build-matrix-forwarder.yaml"
  # checkov:skip=CKV_GHA_7:The boolean rollout input controls deployment only; the image is always built from github.sha.
  workflow_dispatch:
    inputs:
      rollout:
        description: "Roll this build onto the one release every stage shares, prod included"
        type: boolean
        default: false

# Each build dispatches its own sha to infra once it finishes, so two builds on
# one branch can roll out in the order they end rather than the order they were
# pushed. Superseded builds are cancelled instead.
concurrency:
  group: build-matrix-forwarder-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/beeblastco/broods-matrix-forwarder

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --ignore-scripts --no-save

      - name: Type-check matrix forwarder
        run: bun run --filter @broods/matrix-forwarder check

      - name: Test matrix forwarder
        run: bun run --filter @broods/matrix-forwarder test

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: apps/matrix-forwarder/Dockerfile
          push: true
          # The floating branch tag only for dev and main: a feature branch's
          # name has a slash, which no image tag may hold, so a manual dispatch
          # from one ships by sha alone.
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ (github.ref_name == 'dev' || github.ref_name == 'main') && format('{0}:{1}', env.IMAGE_NAME, github.ref_name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # One release, not one per stage: it serves every config plane, prod included.
  # So a push to `dev` builds and tests without shipping, and the roll happens on
  # `main`, which promote.yaml dispatches once it fast-forwards. A manual
  # dispatch with `rollout` ticked rolls whatever branch it ran on, to try a
  # change before promote. That serves prod traffic too.
  rollout:
    needs: build
    if: ${{ github.ref_name == 'main' || inputs.rollout }}
    # No prerequisite gate: this image depends on neither Convex nor the AWS
    # data plane. The grant is still required because rollout.yaml declares it
    # and a called workflow can never hold more than its caller.
    permissions:
      actions: read
    uses: ./.github/workflows/rollout.yaml
    with:
      workflow: deploy-matrix-forwarder.yaml
      tag: ${{ github.sha }}
    secrets:
      dispatchToken: ${{ secrets.INFRA_DISPATCH_TOKEN }}
