name: Build Core Image

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "apps/core/**"
      - "packages/convex/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/build-core.yaml"
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/beeblastco/broods-core

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # Full tests run in ci.yaml; the branch already passed PR CI, so the
      # image build only re-checks types to keep publish latency low.
      - name: Type-check core
        run: bun run --filter @broods/core check

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/core/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Building an image deploys nothing: the pod lives in a k3s cluster the infra
  # repo owns. Without this job a green build meant only that a tag moved, which
  # is how core-dev once served a months-old image behind a passing pipeline.
  rollout:
    needs: build
    if: ${{ github.ref_name == 'dev' || github.ref_name == 'main' }}
    runs-on: ubuntu-24.04
    # A rollout that has not finished in 20 minutes is stuck, not slow: infra
    # caps the Helm wait at 5m and the rollout status at another 5m.
    timeout-minutes: 20
    permissions: {}
    steps:
      - name: Roll the core pod and wait for the rollout
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          INFRA_REPO: beeblastco/infra
          TAG: ${{ github.sha }}
          WORKFLOW: ${{ github.ref_name == 'main' && 'deploy-core.yaml' || 'deploy-core-dev.yaml' }}
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "Missing secret: INFRA_DISPATCH_TOKEN" >&2
            echo "Needs a fine-grained PAT scoped to $INFRA_REPO with Actions: read and write." >&2
            exit 1
          fi

          # Run ids only ever increase, so the newest one before dispatching is a
          # floor that no earlier run can clear. Without it a rerun of this job
          # matches the previous rollout of the same tag and reports its result.
          RUNS_URL="repos/$INFRA_REPO/actions/workflows/$WORKFLOW/runs?event=workflow_dispatch"
          FLOOR_ID=$(gh api "$RUNS_URL&per_page=1" --jq '.workflow_runs[0].id // 0')

          gh workflow run "$WORKFLOW" --repo "$INFRA_REPO" --ref main -f tag="$TAG"

          # An infra run reports infra's own head_sha and the API hides dispatch
          # inputs, so the tag is matched out of display_title instead — infra's
          # run-name puts it there precisely so a caller can find its own run.
          for _ in $(seq 1 60); do
            RUN_ID=$(gh api "$RUNS_URL&per_page=20" \
              --jq "[.workflow_runs[]
                     | select(.id > $FLOOR_ID)
                     | select(.display_title | endswith(\" $TAG\"))] | .[0].id // empty")
            if [[ -n "$RUN_ID" ]]; then
              break
            fi
            sleep 5
          done

          if [[ -z "${RUN_ID:-}" ]]; then
            echo "No $WORKFLOW run in $INFRA_REPO newer than $FLOOR_ID reported tag $TAG" >&2
            exit 1
          fi

          echo "Watching $INFRA_REPO run $RUN_ID (floor $FLOOR_ID, tag $TAG)"

          gh run watch "$RUN_ID" --repo "$INFRA_REPO" --exit-status
