name: Build Core Image

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "apps/core/**"
      - "packages/convex/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/build-core.yaml"
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/beeblastco/broods-core

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --ignore-scripts --no-save

      # Full tests run in ci.yaml; the branch already passed PR CI, so the
      # image build only re-checks types to keep publish latency low.
      - name: Type-check core
        run: bun run --filter @broods/core check

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/core/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Building an image deploys nothing: the pod lives in a k3s cluster the infra
  # repo owns. Without this job a green build meant only that a tag moved, which
  # is how core-dev once served a months-old image behind a passing pipeline.
  rollout:
    needs: build
    if: ${{ github.ref_name == 'dev' || github.ref_name == 'main' }}
    # Core carries both prerequisites: its image must not reach the cluster
    # before the Convex schema it reads or the AWS data plane it calls.
    permissions:
      actions: read
    uses: ./.github/workflows/rollout.yaml
    with:
      workflow: ${{ github.ref_name == 'main' && 'deploy-core.yaml' || 'deploy-core-dev.yaml' }}
      tag: ${{ github.sha }}
      awaitWorkflows: deploy-convex.yaml deploy.yaml
    secrets:
      dispatchToken: ${{ secrets.INFRA_DISPATCH_TOKEN }}
