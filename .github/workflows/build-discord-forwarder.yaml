name: Build Discord Forwarder Image

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "apps/discord-forwarder/**"
      # The two core modules the forwarder imports by relative path. Nothing
      # declares that dependency, so name them here or a rename ships broken.
      - "apps/core/src/shared/env.ts"
      - "apps/core/src/shared/convex/client.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/build-discord-forwarder.yaml"
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/beeblastco/broods-discord-forwarder

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --ignore-scripts --no-save

      - name: Type-check discord forwarder
        run: bun run --filter @broods/discord-forwarder check

      - name: Test discord forwarder
        run: bun run --filter @broods/discord-forwarder test

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/discord-forwarder/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # dev only for now: infra holds a `discord-forwarder-dev` release and no
  # production one yet, and dispatching a workflow that does not exist fails the
  # run. Add the `main` branch here in the same change that adds the prod release.
  rollout:
    needs: build
    if: ${{ github.ref_name == 'dev' }}
    permissions: {}
    uses: ./.github/workflows/rollout.yaml
    with:
      workflow: deploy-discord-forwarder-dev.yaml
      tag: ${{ github.sha }}
    secrets:
      dispatchToken: ${{ secrets.INFRA_DISPATCH_TOKEN }}
