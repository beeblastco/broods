name: Socket transfer

# Measures the bytes the gateway sends down a socket for what an open dashboard
# asks of it, and uploads them. socket-transfer-comment.yaml turns a pull
# request's numbers and its base's into one comment; the dev runs are those bases.
# Not a required check, so a path filter is safe here.
on:
  pull_request:
    paths: &measured
      - apps/gateway/**
      - apps/dashboard/**
      - packages/broods/**
      - apps/core/src/shared/**
      - bun.lock
      - .github/workflows/socket-transfer.yaml
  push:
    branches:
      - dev
    paths: *measured

concurrency:
  group: socket-transfer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each job grants only the token permissions it needs.
permissions: {}

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SOCKET_TRANSFER_OUT: ${{ github.workspace }}/socket-transfer.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/bun-install

      - name: Measure socket transfer
        working-directory: apps/gateway
        run: bun test tests/socket-transfer.test.ts

      - name: Summarise the numbers
        if: always()
        run: bun scripts/socket-transfer-comment.ts --pr "$SOCKET_TRANSFER_OUT" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the numbers
        # Also when a path is over its ceiling: the comment is what names it.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: socket-transfer-${{ github.run_id }}
          path: socket-transfer.json
          if-no-files-found: ignore
          retention-days: 90
