# Keeps the published SDK version in step with the source. Any dev push that
# touches packages/broods derives the next version from the conventional-commit
# subjects since the last bump, verifies the package builds at that version, and
# commits the bump back to dev. "Promote dev to main" then publishes it.
#
# `dev` restricts who may push and the Actions bot is not on that list, so the
# bump lands with RELEASE_PAT, a fine-grained token owned by one of the accounts
# that is. A PAT push does fire `on: push`, which the bot's own push never did,
# so the release commit carries `[skip ci]` rather than re-running CI, the dev
# deploy, and all four image builds on a version string. The commit-message
# check below covers a human pushing a release commit by hand.

name: Bump SDK Version

on:
  push:
    branches:
      - dev
    paths:
      - "packages/broods/**"
  workflow_dispatch:

concurrency:
  group: bump-sdk-version
  cancel-in-progress: false

jobs:
  bump:
    # A release commit is already a bump; re-running would stack a second one.
    if: "${{ !startsWith(github.event.head_commit.message, 'chore(sdk): release broods') }}"
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout dev
        uses: actions/checkout@v7
        with:
          ref: dev
          # Persisted for the push at the end. `dev` declines GITHUB_TOKEN.
          token: ${{ secrets.RELEASE_PAT }}
          # next-version.ts walks package.json history to find the last bump.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: Apply version bump
        id: bump
        shell: bash
        run: |
          set -euo pipefail

          RESULT="$(bun packages/broods/scripts/next-version.ts --write)"
          echo "$RESULT"
          echo "bump=$(echo "$RESULT" | jq -r .bump)" >> "$GITHUB_OUTPUT"
          echo "version=$(echo "$RESULT" | jq -r .next)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.bump.outputs.bump != 'none'
        # Saves on purpose: this is the one job that must write the bumped
        # workspace version into bun.lock, which the commit step then lands.
        run: bun install --ignore-scripts

      - name: Typecheck SDK
        if: steps.bump.outputs.bump != 'none'
        run: bun run --filter broods check

      - name: Test SDK
        if: steps.bump.outputs.bump != 'none'
        run: bun run --filter broods test

      - name: Build and pack check
        if: steps.bump.outputs.bump != 'none'
        working-directory: packages/broods
        run: bun run pack:check

      # Only after the package is proven to build at the new version, so a
      # broken SDK never reaches a version number that promote would publish.
      - name: Commit bump
        if: steps.bump.outputs.bump != 'none'
        shell: bash
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/broods/package.json bun.lock
          git commit -m "chore(sdk): release broods $VERSION [skip ci]"

          # Rebase rather than force: another dev push may have landed while the
          # verification steps above were running.
          git pull --rebase origin dev
          git push origin HEAD:dev

      - name: Summarize
        shell: bash
        env:
          BUMP: ${{ steps.bump.outputs.bump }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail

          if [[ "$BUMP" == "none" ]]; then
            echo "No unreleased commits touch packages/broods; version left at $VERSION." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Bumped broods to **$VERSION** ($BUMP). Run \"Promote dev to main\" to publish it." >> "$GITHUB_STEP_SUMMARY"
          fi
