name: Check deployed OPA policy

# apps/core/opa/broods_authz.rego is the source of truth here but deploys from
# the infra repo, so the two drift with nothing to notice. They did: the
# deployed copy once failed half these cases, including denying an actor who
# did hold the named role. This asserts the policy OPA is actually serving.

on:
  push:
    branches: [dev, main]
    paths:
      - apps/core/opa/broods_authz.rego
      - scripts/opa-decision-cases.ts
      - .github/workflows/opa-policy-check.yaml
  workflow_dispatch:

concurrency:
  group: opa-policy-check-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  decisions:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      # Local first: if the source of truth is itself wrong, say so before
      # blaming the deployment.
      - name: Evaluate cases against the repo copy
        run: |
          curl -fsSL -o opa https://openpolicyagent.org/downloads/v1.18.2/opa_linux_amd64_static
          chmod +x opa
          ./opa check apps/core/opa/broods_authz.rego

      - name: Evaluate cases against the deployed policy
        env:
          OPA_BASE_URL: ${{ vars.OPA_BASE_URL }}
          OPA_API_TOKEN: ${{ secrets.OPA_API_TOKEN }}
        run: bun scripts/opa-decision-cases.ts
