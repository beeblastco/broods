name: "CodeQL Advanced"

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]
  schedule:
    - cron: "35 17 * * 2"

# A new push to a pull request cancels its stale run, as in ci.yaml. Branch
# and scheduled runs are never cancelled mid-run.
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each job grants only the token permissions it needs.
permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Test fixtures named like credentials trip the password heuristics
          # (code-scanning alert 23). Tests never ship, so skip them.
          config: |
            paths-ignore:
              - "**/tests/**"
              - "**/*.test.ts"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{matrix.language}}"
