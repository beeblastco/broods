name: Dashboard e2e

# The signed-in browser suites (apps/dashboard/e2e: `app` for behaviour,
# `perf` for the render budget) against the deployment a rollout just
# updated, since a green build and rollout only say the image is on the
# cluster. On a pull request the same suites run inside ci.yaml, against the
# build that job makes.
#
# Needs the probe account in the target environment: DASHBOARD_E2E_EMAIL and
# DASHBOARD_E2E_PASSWORD, a WorkOS user with email + password auth. The suites
# provision its org and project on first sign-in.

on:
  workflow_run:
    workflows: ["Build Dashboard Image"]
    types: [completed]
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      base_url:
        description: "Dashboard to probe (defaults to the branch's deployment)"
        required: false
        type: string

jobs:
  deployed:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Checkout is all this job does with the token; deny everything else.
    permissions:
      contents: read
    environment: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'production' || 'development' }}
    env:
      E2E_BASE_URL: ${{ inputs.base_url || ((github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'https://dashboard.broods.app' || 'https://dashboard.dev.broods.app') }}
      E2E_EMAIL: ${{ secrets.DASHBOARD_E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.DASHBOARD_E2E_PASSWORD }}
      E2E_PROJECT_ID: ${{ vars.DASHBOARD_E2E_PROJECT_ID }}
    steps:
      - name: Require the probe account
        # A silent skip would look like a passing suite, so missing setup fails.
        shell: bash
        run: |
          missing=()
          for name in E2E_EMAIL E2E_PASSWORD; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "Missing from this environment: ${missing[*]} (DASHBOARD_E2E_EMAIL / DASHBOARD_E2E_PASSWORD)." >&2
            echo "scripts/setup-dashboard-e2e.sh creates them; apps/dashboard/AGENTS.md, section Tests, explains each." >&2
            exit 1
          fi

      - name: Checkout repository
        # Pinned to a SHA (matching ci.yaml) because this job holds the probe
        # login secrets: a retargeted tag must not be able to run new code here.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # This job never pushes, so it needs no git credential left on disk.
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --ignore-scripts --frozen-lockfile

      - name: Install Chromium
        run: cd apps/dashboard && bunx playwright install --with-deps chromium

      - name: Run the signed-in suites against the deployment
        run: cd apps/dashboard && bunx playwright test --project=app --project=perf

      - name: Upload traces of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dashboard-e2e-${{ github.run_id }}
          path: apps/dashboard/test-results
          if-no-files-found: ignore
