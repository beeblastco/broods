components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Account secret obtained from account creation or rotation
    AdminAuth:
      type: http
      scheme: bearer
      description: AdminAccountSecret from SST secrets

  parameters:
    AccountEnvVarName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Z][A-Z0-9_]*$"
        maxLength: 64

  schemas:
    AccountEnvVar:
      type: object
      required: [name, updatedAt]
      properties:
        name:
          type: string
        updatedAt:
          type: number

    DirectApiRequest:
      type: object
      required:
        - agentId
        - eventId
        - conversationKey
        - events
      properties:
        agentId:
          type: string
          description: Selects the account-owned agent config to run
        eventId:
          type: string
          description: Used for account-scoped deduplication
        conversationKey:
          type: string
          description: Selects the account-scoped persisted direct conversation
        mode:
          type: string
          enum: [reject, followup, collect, steer]
          default: steer
          description: Busy-conversation behavior. When omitted, steer combines the contiguous FIFO steer prefix and injects it at the next AI SDK step boundary; it falls back to followup if the active run has no boundary left.
        idempotencyKey:
          type: string
          description: Stable retry identity scoped to account, agent, and conversation. Defaults to eventId and remains bound for the seven-day status window.
        events:
          type: array
          description: Vercel AI SDK-style messages
          items:
            $ref: "#/components/schemas/Message"
        system:
          oneOf:
            - $ref: "#/components/schemas/SystemRunEvent"
            - type: array
              items:
                $ref: "#/components/schemas/SystemRunEvent"
          description: >-
            One-turn Vercel AI SDK-style system message event(s), appended last
            with highest priority. Same lifetime as a direct `events` entry with
            `persist: false`.
        model:
          $ref: "#/components/schemas/RunModelOverrides"

    RunModelOverrides:
      type: object
      description: >-
        Per-run model setting overrides, merged onto `config.model` for one
        invocation only. Accepts standard Vercel AI SDK call settings
        (temperature, topP, topK, maxOutputTokens, frequencyPenalty,
        presencePenalty, seed, stopSequences, reasoning) and provider-specific
        `providerOptions`, the same shape used by `config.model`. Prefer the
        provider-agnostic `reasoning` level (`provider-default | none | minimal
        | low | medium | high | xhigh`) over per-provider reasoning settings in
        `providerOptions`; when both are set the provider-specific setting wins.
        The reserved keys `provider`, `modelId`, `output`, and `apiKey` are
        rejected so a request cannot swap the model, provider, structured output
        contract, or credentials.
      example:
        temperature: 0.3
        maxOutputTokens: 4096
        reasoning: high

    Message:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum: [user, system, tool]
          description: "System events must use `persist: false` and are only supported on the direct API path"
        content:
          oneOf:
            - type: string
            - type: array
              items:
                $ref: "#/components/schemas/ContentBlock"
        persist:
          type: boolean
          description: Must be `false` for system events. Request-local, not stored in Convex.

    SystemRunEvent:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum: [system]
        content:
          type: string
          example: Answer concisely.
        providerOptions:
          type: object
          additionalProperties: true
          description: Provider-specific system-message options such as prompt caching metadata.
        persist:
          type: boolean
          enum: [false]
          description: Optional marker matching direct ephemeral system events.

    ContentBlock:
      type: object
      discriminator:
        propertyName: type
      oneOf:
        - $ref: "#/components/schemas/TextContent"
        - $ref: "#/components/schemas/ImageContent"
        - $ref: "#/components/schemas/FileContent"
        - $ref: "#/components/schemas/ToolCallContent"
        - $ref: "#/components/schemas/ToolResultContent"
        - $ref: "#/components/schemas/ReasoningContent"
        - $ref: "#/components/schemas/SourceUrlContent"
        - $ref: "#/components/schemas/SourceDocumentContent"
        - $ref: "#/components/schemas/ToolApprovalRequestContent"
        - $ref: "#/components/schemas/ToolApprovalResponseContent"

    TextContent:
      type: object
      required:
        - type
        - text
      properties:
        type:
          type: string
          example: text
        text:
          type: string
          example: Hello

    ImageContent:
      type: object
      required:
        - type
        - image
      properties:
        type:
          type: string
          example: image
        image:
          type: string
          description: Base64-encoded image data, URL, or File reference
        mimeType:
          type: string
          description: MIME type of the image (e.g., `image/png`, `image/jpeg`)

    FileContent:
      type: object
      required:
        - type
        - data
      properties:
        type:
          type: string
          example: file
        data:
          type: string
          description: Base64-encoded file data, URL, or File reference
        mimeType:
          type: string
          description: MIME type of the file
        filename:
          type: string

    ToolCallContent:
      type: object
      required:
        - type
        - toolCallId
        - toolName
        - input
      properties:
        type:
          type: string
          example: tool-call
        toolCallId:
          type: string
        toolName:
          type: string
        input:
          type: object
          description: Tool input arguments as generated by the model

    ToolResultContent:
      type: object
      required:
        - type
        - toolCallId
        - toolName
        - output
      properties:
        type:
          type: string
          example: tool-result
        toolCallId:
          type: string
        toolName:
          type: string
        output:
          description: Tool execution result. Can be any JSON value.
        isError:
          type: boolean

    ReasoningContent:
      type: object
      required:
        - type
        - reasoning
      properties:
        type:
          type: string
          example: reasoning
        reasoning:
          type: string
          description: Model's internal reasoning trace (not shown to end users)

    SourceUrlContent:
      type: object
      required:
        - type
        - source
      properties:
        type:
          type: string
          example: source-url
        source:
          type: object
          properties:
            sourceType:
              type: string
              example: url
            url:
              type: string
            title:
              type: string

    SourceDocumentContent:
      type: object
      required:
        - type
        - source
      properties:
        type:
          type: string
          example: source-document
        source:
          type: object
          properties:
            sourceType:
              type: string
              example: document
            documentId:
              type: string
            title:
              type: string
            mediaType:
              type: string

    ToolApprovalRequestContent:
      type: object
      required:
        - type
        - approvalId
        - toolCallId
        - toolName
        - input
      properties:
        type:
          type: string
          example: tool-approval-request
        approvalId:
          type: string
        toolCallId:
          type: string
        toolName:
          type: string
        input:
          type: object
          description: Tool input awaiting user approval

    ToolApprovalResponseContent:
      type: object
      required:
        - type
        - approvalId
        - approved
      properties:
        type:
          type: string
          example: tool-approval-response
        approvalId:
          type: string
          description: Required to match the decision to the pending tool call
        approved:
          type: boolean
          description: Set to false to deny the tool execution
        reason:
          type: string
          description: Reason for approval or denial

    IngressAccepted:
      type: object
      required: [eventId, conversationKey, status, requestedMode, statusUrl]
      properties:
        eventId:
          type: string
        conversationKey:
          type: string
        status:
          type: string
          enum: [accepted, queued, applied, processing]
        requestedMode:
          type: string
          enum: [reject, followup, collect, steer]
        statusUrl:
          type: string
          format: uri

    IngressStatus:
      type: object
      required: [eventId, conversationKey, status]
      properties:
        eventId:
          type: string
        conversationKey:
          type: string
        status:
          type: string
          enum:
            [
              accepted,
              queued,
              applied,
              processing,
              awaiting_approval,
              completed,
              failed,
              expired,
            ]
        requestedMode:
          type: string
          enum: [reject, followup, collect, steer]
          description: Resolved mode for durable ingress. Absent only for status records produced outside ingress coordination, such as an independently running subagent result.
        appliedMode:
          type: string
          enum: [reject, followup, collect, steer]
        appliedToEventId:
          type: string
        result: {}
        response:
          description: Final response payload from the async agent record, present once the run completes.
        approvals:
          type: array
          description: Pending tool approvals while status is awaiting_approval.
          items:
            $ref: "#/components/schemas/PendingToolApproval"
        error:
          type: string
        stoppedByUser:
          type: boolean
          description: True when a `failed` status was a deliberate /stop rather than a fault.

    PendingToolApproval:
      type: object
      required: [approvalId, toolCallId, toolName]
      properties:
        approvalId:
          type: string
        toolCallId:
          type: string
        toolName:
          type: string
        input:
          description: Tool input awaiting user approval

    ToolCompletionSuccess:
      type: object
      required:
        - status
        - response
      properties:
        status:
          type: string
        response:
          type: object

    ToolCompletionFailure:
      type: object
      required:
        - status
        - error
      properties:
        status:
          type: string
        error:
          type: string

    Error:
      type: object
      properties:
        error:
          type: string

    Account:
      type: object
      properties:
        accountId:
          type: string
        username:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [active, disabled]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Agent:
      type: object
      properties:
        accountId:
          type: string
        agentId:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [active, disabled]
        config:
          $ref: "#/components/schemas/AgentConfig"
          description: Redacted — secret-like fields are returned as `********`
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Skill:
      type: object
      properties:
        path:
          type: string
        name:
          type: string
        description:
          type: string
        files:
          type: array
          description: Relative file paths in the bundle (returned by create and get)
          items:
            type: string

    Cron:
      type: object
      properties:
        accountId:
          type: string
        cronId:
          type: string
        name:
          type: string
        description:
          type: string
        agentId:
          type: string
          description: Account-owned agent to run
        events:
          type: array
          description: Canonical stored model-message list delivered to the agent on each invocation.
          items:
            type: object
        conversationKey:
          type: string
          description: Optional public conversation key. Defaults to `cron:{cronId}`.
        scheduleExpression:
          type: string
          description: EventBridge Scheduler expression, such as `cron(...)`, `rate(...)`, or `at(...)`
        timezone:
          type: string
        status:
          type: string
          enum: [active, paused]
        createdAt:
          type: string
        updatedAt:
          type: string
        lastInvokedAt:
          type: string
        lastStatus:
          type: string
          enum: [started, completed, failed]
        lastError:
          type: string

    CronRun:
      type: object
      description: One recorded execution of a cron job.
      properties:
        accountId:
          type: string
        cronId:
          type: string
        runId:
          type: string
        eventId:
          type: string
        conversationKey:
          type: string
        status:
          type: string
          enum: [started, completed, failed]
        result:
          description: Agent run result payload, present on completed runs.
        error:
          type: string
        startedAt:
          type: string
        completedAt:
          type: string

    CronCreate:
      type: object
      description: Provide exactly one of `input` or `events`, mirroring the agent run input.
      required:
        - name
        - agentId
        - scheduleExpression
      properties:
        name:
          type: string
        description:
          type: string
        agentId:
          type: string
          example: agent_maintainer
        input:
          type: string
          description: Shorthand instruction wrapped into a single user message.
          example: Run daily maintenance.
        events:
          type: array
          description: Full model-message list, used instead of `input` for multimodal or multi-message payloads.
          items:
            type: object
        conversationKey:
          type: string
          example: cron:daily-maintenance
        scheduleExpression:
          type: string
          example: cron(0 8 * * ? *)
        timezone:
          type: string
          example: Europe/Amsterdam
        status:
          type: string
          enum: [active, paused]

    CronPatch:
      type: object
      properties:
        name:
          type: string
        description:
          oneOf:
            - type: string
            - type: "null"
        agentId:
          type: string
        input:
          type: string
        events:
          type: array
          items:
            type: object
        conversationKey:
          oneOf:
            - type: string
            - type: "null"
        scheduleExpression:
          type: string
        timezone:
          oneOf:
            - type: string
            - type: "null"
        status:
          type: string
          enum: [active, paused]

    DeleteResponse:
      type: object
      properties:
        deleted:
          type: boolean
        cleanup:
          type: object
          properties:
            conversationsDeleted:
              type: integer
            processedEventsDeleted:
              type: integer
            asyncAgentResultDeleted:
              type: integer
            asyncToolResultDeleted:
              type: integer
            asyncToolGroupDeleted:
              type: integer
            harnessSessionDeleted:
              type: integer
            sandboxReservationDeleted:
              type: integer
            filesystemObjectsDeleted:
              type: integer
            reservedSandboxesReleased:
              type: integer
            agentsDeleted:
              type: integer
            skillObjectsDeleted:
              type: integer
            cronsDeleted:
              type: integer
            accountToolsDeleted:
              type: integer

    AgentConfig:
      type: object
      description: Agent runtime configuration passed via agent create/update. Config patch is a deep merge.
      properties:
        provider:
          $ref: "#/components/schemas/ProviderConfig"
        model:
          $ref: "#/components/schemas/ModelConfig"
        agent:
          $ref: "#/components/schemas/AgentRuntimeConfig"
        harness:
          $ref: "#/components/schemas/HarnessConfig"
        hooks:
          $ref: "#/components/schemas/HooksConfig"
        skills:
          $ref: "#/components/schemas/SkillsConfig"
        subagent:
          $ref: "#/components/schemas/SubagentConfig"
        scheduler:
          $ref: "#/components/schemas/SchedulerConfig"
        policies:
          type: array
          items: { type: string }
          description: >-
            Policy ids that gate this agent. Each policy document carries its
            own mode, so attachment is only the list.
        publicAccess:
          type: boolean
          description: "Opt the agent into the public runtime endpoint (SSE/WebSocket via the stage runtime key). Off by default — secured. When false/unset, public-key requests for this agent are refused with HTTP 403 (code public_access_disabled); internal callers and channel webhooks are unaffected."
        sandbox:
          type: string
          description: Id of the agent-level sandbox config (POST /v1/sandboxes). Powers stateless bash and is the default sandbox for workspaces that don't set their own.
        workspaces:
          type: array
          description: References to account-scoped workspace configs. Agents sharing a workspaceId share files.
          items:
            type: object
            required: [name, workspaceId]
            properties:
              name:
                type: string
                description: Agent-facing mount label (the `workspace` arg the model selects). Unique per agent.
              workspaceId:
                type: string
              sandbox:
                type: [string, "null"]
                description: Optional per-workspace sandbox. A sandbox id overrides the agent-level `sandbox` for this workspace (and its permissionMode). `null` forces this workspace read-only even when an agent-level default exists. Omitted => inherit the agent-level `sandbox`; with no effective sandbox the workspace is read-only (read/glob served directly from S3).
        session:
          $ref: "#/components/schemas/SessionConfig"
        tools:
          $ref: "#/components/schemas/ToolsConfig"
        channels:
          $ref: "#/components/schemas/ChannelsConfig"

    HarnessConfig:
      type: object
      required: [type]
      description: Selects an AI SDK Harness adapter. Omit harness to use the Broods serverless loop. Every configured adapter requires the agent sandbox reference to resolve to a persistent Broods Workdir or Lambda MicroVM.
      properties:
        type:
          type: string
          enum: [claude-code, codex, deepagents, opencode, pi]
        activeTools:
          type: array
          items:
            type: string
          description: Allow-list of adapter built-in and custom tool names. Mutually exclusive with inactiveTools.
        inactiveTools:
          type: array
          items:
            type: string
          description: Tool names to disable. Mutually exclusive with activeTools; channel denyTools are added at runtime.
        debug:
          type: object
          properties:
            enabled:
              type: boolean
            level:
              type: string
              enum: [error, warn, info, debug, trace]
            subsystems:
              type: array
              items:
                type: string
          description: Routes adapter diagnostics into Broods structured logs.
        permissionMode:
          type: string
          enum: [allow-reads, allow-edits, allow-all]
          description: Codex supports only allow-all.
        startupTimeoutMs:
          type: integer
          minimum: 1
          maximum: 600000
        webSearch:
          type: boolean
          description: Enables Codex web search. Not supported by Claude Code.

    PolicyDocument:
      type: object
      required: [version, rules]
      properties:
        version:
          type: integer
          enum: [1]
        mode:
          type: string
          enum: [enforce, audit]
          default: audit
          description: >-
            How hard this policy bites wherever it is attached. audit evaluates
            and records every decision without blocking; enforce lets its deny
            rules refuse, switches the places it is attached to over to
            default-deny, and fails closed when OPA is unavailable.
        rules:
          type: array
          items:
            $ref: "#/components/schemas/PolicyRule"

    PolicyRule:
      type: object
      required: [effect, actions]
      properties:
        id:
          type: string
        effect:
          type: string
          enum: [allow, deny]
        actions:
          type: array
          items:
            type: string
            enum:
              [
                agent.invoke,
                tool.call,
                workspace.read,
                workspace.write,
                workspace.exec,
                subagent.run,
                skill.load,
              ]
            description: >-
              agent.invoke gates the turn itself before any tool runs — "may this
              person address the agent here?". The rest gate one action inside an
              admitted turn.
        resources:
          $ref: "#/components/schemas/PolicyResourceSelector"
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/PolicyCondition"

    PolicyResourceSelector:
      type: object
      properties:
        toolNames: { type: array, items: { type: string } }
        toolIds: { type: array, items: { type: string } }
        workspaceIds: { type: array, items: { type: string } }
        workspaceNames: { type: array, items: { type: string } }
        filePaths: { type: array, items: { type: string } }
        subagentIds: { type: array, items: { type: string } }
        skillPaths: { type: array, items: { type: string } }

    PolicyCondition:
      type: object
      required: [attribute, operator, value]
      properties:
        attribute:
          type: string
          description: >-
            Trusted runtime attribute or dotted path. Examples include accountId,
            project, stage, agentId, channel, channelId, threadId, userId,
            userName, userRoles, toolName, toolId, filePath, workspaceName,
            sandboxPermissionMode, tool.input.command, tool.input.file_path, and
            tool.inputKeys. On an array attribute such as userRoles, `contains`
            means membership and `in`/`notIn` test overlap.
        operator:
          type: string
          enum: [equals, notEquals, in, notIn, prefix, contains]
        value:
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: array
              items:
                oneOf:
                  - type: string
                  - type: number
                  - type: boolean

    ChannelRecordConfig:
      type: object
      required: [agentBindings]
      description: >-
        A channel record narrows and adds; it never grants capability the agent
        lacks. Provider, model and credentials stay on the agent.
      properties:
        instructions:
          type: string
          description: Appended after the agent's own system prompt.
        agentBindings:
          type: array
          minItems: 1
          items:
            type: object
            required: [agentId]
            properties:
              agentId: { type: string }
              isDefault: { type: boolean }
          description: At most one binding may be marked default.
        workspaces:
          type: array
          items:
            type: object
            required: [name, workspaceId]
            properties:
              name: { type: string }
              workspaceId: { type: string }
        policies:
          type: array
          items: { type: string }
          description: >-
            Policy ids added to whatever the agent already carries. Each policy
            document carries its own mode, so attachment is only the list.
        denyTools:
          type: array
          items: { type: string }
          description: >-
            Tool names withheld in this channel, applied after the tool set is
            built — so it also covers sandbox tools (bash, read, …) that
            config.tools cannot name. Narrowing only; unknown names are ignored.
        replyIn:
          type: string
          enum: [thread, source]
          description: >-
            Where the reply lands. thread opens a thread on the message; source
            answers wherever the message came from, and only threads when the
            message itself arrived in one. Slack only — no other provider gives
            the runtime a choice of place. Defaults to thread in a channel and
            source in a DM.
        partition:
          oneOf:
            - type: object
              required: [by]
              # alias is only meaningful on a conversation scope; the API rejects
              # it here, so the schema must too or clients validate what 400s.
              not: { required: [alias] }
              properties:
                by: { type: string, enum: [shared] }
            - type: object
              required: [by, alias]
              properties:
                by: { type: string, enum: [conversation] }
                alias: { type: string }
        sandboxImages:
          type: array
          items: { type: string }
        tagRoles:
          type: array
          items:
            type: object
            required: [roleId]
            properties:
              roleId: { type: string }
              userIds: { type: array, items: { type: string } }
          description: Named groups of people, readable from policy as userRoles.

    ChannelRecordCreate:
      type: object
      required: [platform, externalId, name, config]
      properties:
        platform:
          type: string
          description: Adapter name, e.g. slack, discord, telegram, github, pancake, zalo.
        externalId:
          type: string
          description: Provider id of the place — a Slack channel id, or an owner/repo.
        workspaceRef:
          type: string
          description: Team or guild the place sits in, when the provider has one.
        name:
          type: string
        description:
          type: string
        config:
          $ref: "#/components/schemas/ChannelRecordConfig"

    ChannelRecordUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: [string, "null"]
        workspaceRef:
          type: [string, "null"]
        config:
          $ref: "#/components/schemas/ChannelRecordConfig"
        status:
          type: string
          enum: [active, deleted]

    ChannelRecord:
      allOf:
        - $ref: "#/components/schemas/ChannelRecordCreate"
        - type: object
          properties:
            accountId:
              type: string
            channelId:
              type: string
            status:
              type: string
              enum: [active, deleted]
            createdAt:
              type: string
            updatedAt:
              type: string

    AgentPolicyCreate:
      type: object
      required: [name, document]
      properties:
        name:
          type: string
        description:
          type: string
        document:
          $ref: "#/components/schemas/PolicyDocument"

    AgentPolicyUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: [string, "null"]
        document:
          $ref: "#/components/schemas/PolicyDocument"
        status:
          type: string
          enum: [active, deleted]

    AgentPolicy:
      allOf:
        - $ref: "#/components/schemas/AgentPolicyCreate"
        - type: object
          properties:
            accountId:
              type: string
            policyId:
              type: string
            status:
              type: string
              enum: [active, deleted]
            createdAt:
              type: string
            updatedAt:
              type: string

    ProviderConfig:
      type: object
      description: >-
        Constructor settings for the Vercel AI SDK provider, keyed by provider
        name. The provider named by `model.provider` must have an entry here,
        and that entry must carry its `apiKey`. Everything else is handed to
        that provider's AI SDK factory unchanged, so whatever the factory
        accepts is accepted here. Secret-like fields are encrypted at rest and
        redacted from reads.
      propertyNames:
        enum:
          - anthropic
          - azure
          - baseten
          - bedrock
          - cerebras
          - cohere
          - custom
          - deepinfra
          - deepseek
          - fireworks
          - google
          - groq
          - minimax
          - mistral
          - openai
          - perplexity
          - togetherai
          - v0
          - vercel
          - vertex
          - xai
      additionalProperties:
        $ref: "#/components/schemas/ProviderSettings"

    ProviderSettings:
      type: object
      description: >-
        Settings for one provider. Only the fields broods reads itself are
        listed; any other setting the provider's AI SDK factory supports is
        forwarded as-is.
      additionalProperties: true
      properties:
        apiKey:
          type: string
        base_url:
          type: string
          description: OpenAI-compatible endpoint, required for `custom`. `baseURL` is accepted as an alias; the camel-case `baseUrl` is rejected.
        baseURL:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string

    ModelConfig:
      type: object
      description: Controls the Vercel AI SDK `streamText` call. All standard call settings pass through directly, and provider-specific settings use `providerOptions`.
      properties:
        provider:
          type: string
          description: Provider constructor key matching `provider` config
        modelId:
          type: string
          description: Provider-specific model identifier
        reasoning:
          type: string
          enum: [provider-default, none, minimal, low, medium, high, xhigh]
          description: Provider-agnostic reasoning level. Provider-specific `providerOptions` reasoning settings take precedence when both are set.
        temperature:
          type: number
        maxOutputTokens:
          type: integer
        topP:
          type: number
        topK:
          type: integer
        presencePenalty:
          type: number
        frequencyPenalty:
          type: number
        seed:
          type: integer
        maxRetries:
          type: integer
        stopSequences:
          type: array
          items:
            type: string
        timeout:
          description: Vercel AI SDK timeout setting in milliseconds or `{ totalMs }`
          oneOf:
            - type: integer
            - type: object
              properties:
                totalMs:
                  type: integer
        output:
          $ref: "#/components/schemas/OutputConfig"
        providerOptions:
          type: object
          description: Vercel AI SDK provider-specific options

    OutputConfig:
      type: object
      description: Structured output config. JSON-only so it can be stored in encrypted agent config. Use JSON Schema rather than Zod.
      properties:
        type:
          type: string
          enum: [text, object, array, choice, json]
        name:
          type: string
        description:
          type: string
        schema:
          type: object
          description: JSON Schema for `object` type
        element:
          type: object
          description: JSON Schema for `array` element type
        options:
          type: array
          items:
            type: string
          description: String options for `choice` type

    AgentRuntimeConfig:
      type: object
      description: Controls harness behavior for the model/tool loop and agent-level system prompt.
      properties:
        maxTurn:
          type: integer
          description: Maximum model/tool loop steps per conversation turn
        system:
          oneOf:
            - type: string
            - $ref: "#/components/schemas/SystemRunEvent"
            - type: array
              items:
                $ref: "#/components/schemas/SystemRunEvent"
          description: Agent-level system prompt used on every run. Accepts a string shorthand or Vercel AI SDK-style system message event(s).

    HooksConfig:
      type: object
      description: Lifecycle hooks publish stable agent runtime events. Delivery is best-effort.
      properties:
        webhooks:
          type: array
          description: Outbound event webhooks. An agent may register several; every enabled entry whose events allow-list matches is delivered independently.
          items:
            type: object
            properties:
              enabled:
                type: boolean
              url:
                type: string
                description: HTTPS endpoint for event JSON
              secret:
                type: string
                description: HMAC signing secret for `X-Webhook-Signature`
              events:
                type: array
                items:
                  type: string
                description: Optional allow-list; omitted means all events

    SkillsConfig:
      type: object
      description: When enabled, the runtime includes allowed skill metadata in the system prompt and exposes `load_skill`.
      properties:
        enabled:
          type: boolean
        allowed:
          type: array
          items:
            type: string
          description: Account-scoped skill paths (e.g., `acct_.../support-flow`)

    SchedulerConfig:
      type: object
      description: When enabled, the runtime exposes `schedule`, `list_schedules`, `update_schedule`, and `cancel_schedule`, which manage cron jobs for this agent bound to the calling conversation. Off by default.
      properties:
        enabled:
          type: boolean

    SubagentConfig:
      type: object
      description: When enabled, the runtime exposes `run_subagent` and adds predefined subagent metadata to the parent prompt.
      properties:
        enabled:
          type: boolean
        allowed:
          type: array
          items:
            type: string
          description: Predefined same-account agent ids; empty means virtual subagents only
        context:
          type: string
          enum: [new, inherited]
          description: Default child context mode; omitted means `new`
        mode:
          type: string
          enum: [ephemeral, persistent]
          description: Child conversation persistence mode; omitted means `persistent`
        stream:
          type: boolean
          default: false
          description: Publish child reasoning, text, and tool stream parts to the existing WebSocket/JetStream attach path

    SessionConfig:
      type: object
      description: Controls model-visible history management.
      properties:
        pruning:
          type: object
          properties:
            enabled:
              type: boolean
              description: "Automatic history pruning (default: `true`)"
        compaction:
          type: object
          properties:
            enabled:
              type: boolean
              description: "Context compaction (default: `false`)"
            maxContextLength:
              type: integer
              description: Serialized character-length threshold

    ToolsConfig:
      type: object
      description: >-
        Enables uploaded account tools by `toolId` key and provider-defined
        tools by the name the configured AI SDK provider exposes on its `tools`
        namespace (for example `googleSearch`, `urlContext`, or `codeExecution`
        on `google`). Core ships no built-in external tools. A name the
        configured provider does not expose is rejected when the agent runs.
        Omitting a key or setting `enabled: false` disables the tool.
      additionalProperties:
        oneOf:
          - $ref: "#/components/schemas/UploadedToolConfig"
          - $ref: "#/components/schemas/ProviderToolConfig"

    AccountToolCreate:
      type: object
      description: >-
        Either a bundled tool (`bundle` set, `runtime` isolate or sandbox) or an
        http tool (`runtime: "http"` with `endpointUrl`). The two tiers are
        mutually exclusive.
      oneOf:
        - required: [name, description, inputSchema, bundle]
        - required: [name, description, inputSchema, runtime, endpointUrl]
      properties:
        name:
          type: string
          description: Model-facing tool name.
        description:
          type: string
        inputSchema:
          type: object
          description: JSON Schema for the AI SDK tool input.
        bundle:
          type: string
          description: Already-bundled JavaScript module source. Must not be set for http tools.
        runtime:
          type: string
          enum: [isolate, sandbox, http]
          description: Execution tier. Inferred from the bundle on create when omitted; "http" requires endpointUrl and forbids bundle.
        endpointUrl:
          type: string
          format: uri
          description: Https URL the tool input is POSTed to as JSON. Only valid with runtime "http".
        endpointHeaders:
          type: object
          additionalProperties:
            type: string
          description: Static headers sent with every call. Values may reference `${NAME}` variables resolved from the agent's tool config env at run time.
        defaultConfig:
          type: object
          description: Non-secret default runtime config.

    AccountToolUpdate:
      type: object
      description: Omitted fields keep their stored values. Switching between bundled and http clears the other tier's fields.
      properties:
        name:
          type: string
        description:
          type: string
        inputSchema:
          type: object
        bundle:
          type: string
        runtime:
          type: string
          enum: [isolate, sandbox, http]
        endpointUrl:
          type: string
          format: uri
          description: Only valid when the resulting runtime is "http". Send an empty object in endpointHeaders to clear headers.
        endpointHeaders:
          type: object
          additionalProperties:
            type: string
        defaultConfig:
          type: object

    AccountTool:
      type: object
      properties:
        accountId:
          type: string
        toolId:
          type: string
          example: qs78zwc4z4q5ysxm74fgrhd13s88xxt
        projectId:
          type: string
        stageId:
          type: string
        name:
          type: string
        description:
          type: string
        inputSchema:
          type: object
        sha256:
          type: string
          description: Bundle checksum. Absent for http tools.
        runtime:
          type: string
          enum: [isolate, sandbox, http]
        endpointUrl:
          type: string
          format: uri
          description: Set only for http tools.
        endpointHeaders:
          type: object
          additionalProperties:
            type: string
          description: Set only for http tools.
        defaultConfig:
          type: object
        status:
          type: string
          enum: [active, deleted]
        createdAt:
          type: string
        updatedAt:
          type: string
        deletedAt:
          type: string

    UploadedToolConfig:
      type: object
      description: "Config for an account-uploaded custom tool. The object key is the returned `toolId`."
      properties:
        enabled:
          type: boolean
        async:
          type: boolean
        needsApproval:
          type: boolean
        config:
          type: object
          description: "Runtime config merged over the tool's upload-time `defaultConfig`."

    ProviderToolConfig:
      type: object
      description: >-
        A tool the configured AI SDK provider executes itself, keyed by the name
        it exposes on its `tools` namespace. Accepts either the descriptor a
        provider tool serializes to (`type`/`id`/`args`, as produced by
        `google.tools.googleSearch({...})`) or a flat object whose keys other
        than `enabled`, `needsApproval`, and `async` are the tool's arguments.
      properties:
        enabled:
          type: boolean
        needsApproval:
          type: boolean
        async:
          type: boolean
        type:
          type: string
          enum: [provider, provider-defined]
          description: Present when the value came from an AI SDK provider tool factory.
        id:
          type: string
          description: "Provider tool id, for example `google.google_search`."
        args:
          type: object
          description: Arguments the provider tool was built with.
      additionalProperties: true

    ChannelsConfig:
      type: object
      description: Channel webhook configuration. Webhook URLs follow the pattern `/webhooks/{accountId}/{channel}` for a production stage, or `/webhooks/{accountId}/dev/{endpointId}/{channel}` for any other stage.
      properties:
        telegram:
          type: object
          properties:
            id:
              type: string
              description: Optional stable identifier for this channel connection (set by CLI-generated channel references).
            apiUrl:
              type: string
            botToken:
              type: string
            webhookSecret:
              type: string
            allowedChannelIds:
              type: array
              items:
                type: string
              description: Rooms this connection answers in. Every room when omitted or set to ["*"], none when empty.
            allowedUserIds:
              type: array
              items:
                type: string
              description: Provider user ids allowed to trigger the agent. Everyone when omitted or set to ["*"].
            botUsername:
              type: string
              description: Bot's @username, e.g. `tracy_bot`. When set, group messages run the agent only if they mention it, reply to it, or carry a slash command. Every message keeps running the agent when omitted.
            reactionEmoji:
              type: string
            trace:
              type: string
              enum: [enabled, disabled]
              default: disabled
              description: Whether replies from this channel include a dashboard trace link. Off by default. Trace collection is unaffected.
            partition:
              type: object
              description: "Hierarchical workspace isolation scope for workspaces with `isolation: true`."
              required: [by]
              properties:
                alias:
                  type: string
                  pattern: "^[A-Za-z0-9._-]+$"
                  description: Model-visible child scope folder name. Required when by is conversation; not allowed when by is shared.
                by:
                  type: string
                  enum: [shared, conversation]
        github:
          type: object
          properties:
            id:
              type: string
              description: Optional stable identifier for this channel connection (set by CLI-generated channel references).
            apiUrl:
              type: string
            webhookSecret:
              type: string
            appId:
              type: string
            privateKey:
              type: string
              description: GitHub App private key (PEM)
            allowedChannelIds:
              type: array
              items:
                type: string
              description: Rooms this connection answers in. Every room when omitted or set to ["*"], none when empty.
            allowedUserIds:
              type: array
              items:
                type: string
              description: Provider user ids allowed to trigger the agent. Everyone when omitted or set to ["*"].
            userName:
              type: string
              description: Bot username for @-mention detection (e.g. `my-bot` or `my-bot[bot]`). When set, the bot only responds to comments that mention it.
            botUserId:
              type: number
              description: Bot's numeric GitHub user ID for self-message detection. Auto-detected from the GitHub API when omitted.
            triggerOnIssueOpen:
              type: boolean
              description: When false, the bot does not auto-trigger on new issues (opened, edited, reopened). Defaults to true.
            triggerOnPROpen:
              type: boolean
              description: When false, the bot does not auto-trigger on new pull requests (opened, edited, reopened). Defaults to true.
            trace:
              type: string
              enum: [enabled, disabled]
              default: disabled
              description: Whether replies from this channel include a dashboard trace link. Off by default. Trace collection is unaffected.
            partition:
              type: object
              description: "Hierarchical workspace isolation scope for workspaces with `isolation: true`."
              required: [by]
              properties:
                alias:
                  type: string
                  pattern: "^[A-Za-z0-9._-]+$"
                  description: Model-visible child scope folder name. Required when by is conversation; not allowed when by is shared.
                by:
                  type: string
                  enum: [shared, conversation]
        slack:
          type: object
          properties:
            id:
              type: string
