            schema:
              $ref: "#/components/schemas/AccountToolCreate"
      responses:
        "201":
          description: Tool created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountTool"
        "400": { description: Missing project or stage }
        "404": { description: Project or stage not found }
    get:
      tags: [Tools]
      summary: List uploaded custom tools
      description: Lists the tools of one project stage. Both query parameters are required.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: project, in: query, required: true, schema: { type: string } }
        - { name: stage, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Tool list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tools:
                    type: array
                    items:
                      $ref: "#/components/schemas/AccountTool"
        "400": { description: Missing project or stage }
        "404": { description: Project or stage not found }

  /v1/tools/{toolId}:
    get:
      tags: [Tools]
      summary: Get uploaded custom tool
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: toolId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Tool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountTool"
        "404": { description: Not found }
    patch:
      tags: [Tools]
      summary: Update uploaded custom tool
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: toolId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountToolUpdate"
      responses:
        "200":
          description: Updated tool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountTool"
    delete:
      tags: [Tools]
      summary: Delete uploaded custom tool
